name: CI Pipeline

# Пайплайн запускается при пуше в ветку main и при создании Pull Request-ов
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 1. Проверка сборки Docker-контейнеров
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Отладка (Checkout кода)
        uses: actions/checkout@v4

      - name: Проверка сборки Docker Compose
        run: docker compose build

  # 2. Проверка фронтенда (React)
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установка зависимостей
        run: npm install

      - name: Тестовая сборка (Build)
        run: npm run build

  # 3. Сборка и публикация Docker-образа (аналог build-job)
  build-and-push:
    runs-on: ubuntu-latest
    # Запускаем только после успешных проверок и только в ветке main
    needs: [docker-build, frontend-check]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry (GitHub Container Registry)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set lower case repository name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LC }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/vds-test:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

  # 4. Деплой на сервер (аналог deploy-job)
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IPADDRESS }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Переводим название репозитория в нижний регистр
            REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            # Логинимся в GHCR на сервере
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Останавливаем и удаляем старый контейнер, если есть
            docker stop mynginx1 || true
            docker rm mynginx1 || true
            
            # Запускаем новый контейнер (для frontend используется порт 5173)
            docker run --name mynginx1 -p 80:5173 -d ghcr.io/${REPO_LC}/vds-test:${{ github.sha }}
