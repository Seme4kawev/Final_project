services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sports_db
      POSTGRES_USER: sports_user
      POSTGRES_PASSWORD: sports_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports_user -d sports_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    command: >
      sh -c "python manage.py makemigrations courts_api &&
             python manage.py migrate &&
             python manage.py shell -c 'from courts_api.seed import seed_db; seed_db()' &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_NAME=sports_db
      - DB_USER=sports_user
      - DB_PASSWORD=sports_password
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=django-insecure-test-key-12345
      - DEBUG=True

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      # Исключаем локальную папку node_modules из монтирования,
      # чтобы использовалась та, что внутри контейнера
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  postgres_data:
