name: CI Pipeline

# Пайплайн запускается при пуше в ветку main и при создании Pull Request-ов
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 1. Проверка сборки Docker-контейнеров
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Отладка (Checkout кода)
        uses: actions/checkout@v4

      - name: Проверка сборки Docker Compose
        run: docker compose build

  # 2. Проверка фронтенда (React)
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установка зависимостей
        run: npm install

      - name: Тестовая сборка (Build)
        run: npm run build

  # 3. Деплой на сервер (копирование файлов и запуск docker compose)
  deploy:
    runs-on: ubuntu-latest
    # Запускаем только после успешных проверок
    needs: [docker-build, frontend-check]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy project files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_IPADDRESS }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "."
          target: "/opt/final_project"
          rm: true

      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IPADDRESS }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /opt/final_project
            # Задаем порт 80 для фронтенда перед запуском
            export FRONTEND_PORT=80
            docker compose down || true
            docker compose up -d --build
